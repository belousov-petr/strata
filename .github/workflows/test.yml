name: test

# Lint, scaffold check, and the node test suite (hook + strata script) on every
# OS strata supports. A release is only merged and tagged when this is green.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22"]
        include:
          - os: ubuntu-latest
            node: "20"
          - os: ubuntu-latest
            node: "24"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Node tests (verbose on failure)
        run: node --test tests/*.test.mjs
      - name: Repo lint
        run: bash tests/lint.sh
      - name: Scaffold check
        run: bash tests/scaffold-check.sh
